[package]
name = "rumpus"
version = "0.6.1"
license = "GPL-3.0-or-later"
description = "A framework for navigation using skylight polarization."
homepage = "https://benpot.com"
repository = "https://github.com/benjaminpotter/rumpus"
readme = "README.md"
keywords = ["polarization", "raytrace", "navigation", "image"]
edition = "2024"
exclude = ["tests/snapshots/*"]

[dependencies]
rayon = "1.10.0"
spa = "0.5.1"
sguaba = "0.9.4"
uom = "0.37.0"
thiserror = "2.0.17"
chrono = "0.4.41"

[dev-dependencies]
image = { version="0.25.6", features=["rayon"] }
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
rstest = "0.26.1"
approx = "0.5.1"
insta = "1.46.1"
anyhow = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "image"
harness = false
